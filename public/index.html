<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Asistente virtual conversacional" />
    <title>Asistente virtual</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-card" aria-label="Chat con el asistente">
        <header class="chat-header">
          <div class="avatar" aria-hidden="true">AI</div>
          <div>
            <h1>Asistente virtual</h1>
            <p><span class="status-dot"></span> Disponible</p>
          </div>
          <button id="new-chat" class="icon-button" type="button" title="Nueva conversación" aria-label="Nueva conversación">↻</button>
        </header>

        <div id="messages" class="messages" aria-live="polite">
          <article class="message assistant">
            <div class="bubble">¡Hola! Soy tu asistente virtual. Cuéntame con tus propias palabras, ¿en qué puedo ayudarte?</div>
          </article>
        </div>

        <div id="notice" class="notice" hidden></div>

        <form id="chat-form" class="composer">
          <label class="sr-only" for="message">Escribe tu mensaje</label>
          <textarea id="message" rows="1" maxlength="4000" placeholder="Escribe un mensaje…" autocomplete="off" required></textarea>
          <button id="send" type="submit" aria-label="Enviar mensaje">➤</button>
        </form>
        <p class="disclaimer">La IA puede equivocarse. Verifica la información importante.</p>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
