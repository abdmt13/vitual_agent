[project]
name = "chatbot-backend"
version = "0.1.0"
description = "Clean Architecture Backend with FastAPI, CQRS, Mediator, SQLAlchemy 2.0 Async, Redis and Kafka"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "asyncmy>=0.2.9",
    "aiomysql>=0.2.0",
    "dependency-injector>=4.45.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "redis[hiredis]>=5.2.0",
    "aiokafka>=0.12.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
executionEnvironments = [
  { root = "." }
]

